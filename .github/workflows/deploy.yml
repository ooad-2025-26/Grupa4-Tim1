name: Deployanje SmartPark MVC aplikacije na linux server

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: smartPark env

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login na Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      #- name: Build Docker image
      #  run: docker build -t smartpark-mvc:latest .

      - name: Build i push Docker image na Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{vars.DOCKERHUB_USERNAME}}/smartpark-mvc:latest

      - name: Zaustavi stare kontejnere
        run: |
          docker stop smartpark-app 2>/dev/null || true
          docker rm smartpark-app 2>/dev/null || true

      - name: Pokreni novi kontejner
        run: |
          docker run -d \
            --name smartpark-app \
            --restart unless-stopped \
            -p 9090:9090 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e ConnectionStrings__DefaultConnection="${{ secrets.CONNECTION_STRINGS__DEFAULTCONNECTION }}" \
            -e Email__Username="${{ secrets.EMAIL_USERNAME }}" \
            -e Email__Password="${{ secrets.EMAIL_PASSWORD }}" \
            -e Email__FromAddress="${{ secrets.EMAIL_FROM_ADDRESS }}" \
            -e Email__FromName="${{ secrets.EMAIL_FROM_NAME }}" \
            -e Email__SmtpHost="${{ secrets.EMAIL_HOST }}" \
            -e Email__SmtpPort="${{ secrets.EMAIL_PORT }}" \
            -e Email__UseTls="true" \
            -e Email__UseSsl="false" \
            ${{ vars.DOCKERHUB_USERNAME }}/smartpark-mvc:latest

      - name: Provjeri deployment
        run: |
          sleep 5
          if docker ps | grep -q smartpark-app; then
          echo "deployment uspjesan"
          docker logs --tail 20 smartpark-app
          else
          echo "deployment pao"
          exit 1
          fi
